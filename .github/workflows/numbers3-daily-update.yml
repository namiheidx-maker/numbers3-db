name: Numbers3 Data Update

on:
  schedule:
    # 毎日 09:00 JST (UTC 00:00)
    - cron: '0 0 * * *'
    # 平日 18:00 JST (UTC 09:00、月～金のみ)
    - cron: '0 9 * * 1-5'

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scheduled update
        run: |
          cd /home/runner/work/numbers3-db/numbers3-db
          python3 scripts/scheduled_update.py

      - name: Commit changes if needed
        run: |
          cd /home/runner/work/numbers3-db/numbers3-db
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ -n "$(git status -s)" ]; then
            git add -A
            git commit -m "Data update: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
        continue-on-error: true
