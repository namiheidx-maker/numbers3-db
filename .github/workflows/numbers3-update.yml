name: Numbers3 Update

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Cache database
        uses: actions/cache@v3
        with:
          path: db/numbers3.db
          key: numbers3-db-cache
      - name: Create db directory
        run: mkdir -p db
      - run: pip install requests beautifulsoup4
      - run: python3 scripts/scheduled_update.py
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          [ -n "$(git status -s)" ] && git add -A && git commit -m "Data update: $(date +'%Y-%m-%d %H:%M:%S')" && git push || echo "No changes"
        continue-on-error: true
